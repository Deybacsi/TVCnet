; TVCnet, the TVC tape-port WiFi module, on an ESP32-S3-Zero clone (ESP32-S3FH4R2: 4 MB flash, 2 MB quad PSRAM).
; Needs PlatformIO Core 6.2.0 or newer (the pioarduino 55.x platform requires it).

[env:esp32s3zero]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; 4 MB QIO flash, quad PSRAM (qio_qspi), USB-Serial/JTAG, BOARD_HAS_PSRAM
board = waveshare_esp32_s3_zero
framework = arduino
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_flags =
    -Wall
    -Wextra
lib_deps =
    symlink://../common
monitor_speed = 115200
